<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASX Research Agent</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#0a0b0f;
  --bg-surface:#12141a;
  --bg-card:#181b23;
  --bg-elevated:#1e2130;
  --bg-hover:#252838;
  --border:#ffffff0a;
  --border-subtle:#ffffff06;
  --text-primary:#e8e9ed;
  --text-secondary:#8b8fa3;
  --text-muted:#565a6e;
  --accent:#6ee7b7;
  --accent-dim:#6ee7b730;
  --accent-glow:#6ee7b715;
  --red:#f87171;
  --red-dim:#f8717125;
  --amber:#fbbf24;
  --blue:#60a5fa;
  --blue-dim:#60a5fa20;
  --font-body:'DM Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --font-display:'Instrument Serif',Georgia,serif;
  --radius:12px;
  --radius-sm:8px;
  --radius-pill:999px;
}
html{height:100%}
body{
  font-family:var(--font-body);
  background:var(--bg-deep);
  color:var(--text-primary);
  height:100%;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.app{
  display:flex;flex-direction:column;
  height:100vh;max-width:860px;margin:0 auto;
  padding:0 24px;
}
.header{
  padding:20px 0 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;
  flex-shrink:0;
}
.header-icon{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,#6ee7b718,#60a5fa18);
  border:1px solid #6ee7b720;
  display:flex;align-items:center;justify-content:center;
}
.header-icon svg{width:18px;height:18px;stroke:var(--accent);stroke-width:1.5;fill:none}
.header h1{font-size:15px;font-weight:500;letter-spacing:-0.01em}
.header span{font-size:12px;color:var(--text-muted);margin-top:2px}

.chat{
  flex:1;overflow-y:auto;padding:24px 0 16px;
  scrollbar-width:thin;scrollbar-color:var(--bg-elevated) transparent;
}
.chat::-webkit-scrollbar{width:5px}
.chat::-webkit-scrollbar-thumb{background:var(--bg-elevated);border-radius:10px}

.welcome{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  height:100%;padding-bottom:40px;
  animation:fadeUp .6s ease;
}
.welcome h2{
  font-family:var(--font-display);
  font-size:32px;font-weight:400;
  letter-spacing:-0.02em;
  margin-bottom:8px;
  background:linear-gradient(135deg,var(--text-primary),var(--text-secondary));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.welcome p{font-size:14px;color:var(--text-muted);margin-bottom:32px}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:540px}
.suggestions button{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius-pill);padding:9px 18px;
  font-size:13px;color:var(--text-secondary);cursor:pointer;
  font-family:var(--font-body);transition:all .2s;
}
.suggestions button:hover{
  border-color:var(--accent-dim);color:var(--accent);
  background:var(--accent-glow);
  transform:translateY(-1px);
}

.msg{margin-bottom:24px;animation:fadeUp .35s ease}
.msg-user{display:flex;justify-content:flex-end}
.msg-user .bubble{
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:20px 20px 6px 20px;
  padding:11px 18px;max-width:70%;
  font-size:14px;line-height:1.55;
}
.msg-assistant{max-width:100%}

.thinking{margin-bottom:14px}
.thinking-toggle{
  background:none;border:none;padding:5px 0;cursor:pointer;
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--text-muted);font-family:var(--font-body);
}
.thinking-toggle:hover{color:var(--text-secondary)}
.thinking-toggle svg{transition:transform .15s}
.thinking-toggle.open svg{transform:rotate(90deg)}
.thinking-steps{
  border-left:1.5px solid var(--border);
  margin-left:5px;padding:8px 0 4px 16px;
}
.step{
  display:flex;align-items:center;gap:10px;
  padding:4px 0;font-size:13px;
  transition:opacity .3s;
}
.step.pending{opacity:.3}
.step.running{opacity:.6}
.step.done{opacity:1}
.step-check{color:var(--accent);font-size:12px;width:14px;text-align:center;flex-shrink:0}
.step-spinner{
  width:13px;height:13px;border:1.5px solid var(--text-muted);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .8s linear infinite;flex-shrink:0;
}
.step-dot{
  width:5px;height:5px;border-radius:50%;
  background:var(--text-muted);flex-shrink:0;margin:0 4px;
}
.step code{font-family:var(--font-mono);font-size:12px;color:var(--text-primary)}
.step .step-input{color:var(--text-muted);font-size:12px}

.analysis p{
  font-size:14.5px;line-height:1.7;
  margin-bottom:12px;color:var(--text-secondary);
}
.analysis p strong{color:var(--text-primary);font-weight:500}
.analysis .disclaimer{font-size:12px;color:var(--text-muted);font-style:italic;margin-top:4px}

.stock-table{
  margin:16px 0 4px;border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;
}
.stock-table table{width:100%;border-collapse:collapse;font-size:13px}
.stock-table thead{background:var(--bg-card)}
.stock-table th{
  padding:10px 14px;text-align:right;font-weight:400;
  font-size:11px;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.06em;
  border-bottom:1px solid var(--border);
}
.stock-table th:first-child,.stock-table th:nth-child(2){text-align:left}
.stock-table td{
  padding:10px 14px;text-align:right;
  border-bottom:1px solid var(--border-subtle);
}
.stock-table tr:last-child td{border-bottom:none}
.stock-table td:first-child{
  text-align:left;font-family:var(--font-mono);
  font-weight:500;font-size:12px;color:var(--accent);
}
.stock-table td:nth-child(2){text-align:left;color:var(--text-secondary);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stock-table tr{transition:background .15s}
.stock-table tbody tr:hover{background:var(--bg-card)}
.positive{color:var(--accent)}
.negative{color:var(--red)}
.muted{color:var(--text-muted)}

.input-area{
  padding:12px 0 16px;flex-shrink:0;
  border-top:1px solid var(--border);
}
.input-wrap{
  display:flex;align-items:center;gap:0;
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:var(--radius-pill);
  padding:5px 5px 5px 20px;
  transition:border-color .2s,box-shadow .2s;
}
.input-wrap:focus-within{
  border-color:var(--accent-dim);
  box-shadow:0 0 0 3px var(--accent-glow);
}
.input-wrap input{
  flex:1;background:transparent;border:none;outline:none;
  font-size:14px;color:var(--text-primary);
  font-family:var(--font-body);padding:8px 0;
}
.input-wrap input::placeholder{color:var(--text-muted)}
.input-wrap input:disabled{opacity:.5}
.send-btn{
  width:34px;height:34px;border-radius:50%;border:none;
  background:var(--bg-elevated);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;flex-shrink:0;
}
.send-btn.active{background:var(--accent);cursor:pointer}
.send-btn.active:hover{filter:brightness(1.1);transform:scale(1.05)}
.send-btn svg{width:14px;height:14px}
.input-footer{text-align:center;font-size:11px;color:var(--text-muted);padding-top:8px}

.loading-dots{display:flex;gap:5px;padding:8px 0}
.loading-dots span{
  width:5px;height:5px;border-radius:50%;
  background:var(--text-muted);
  animation:blink 1.2s ease-in-out infinite;
}
.loading-dots span:nth-child(2){animation-delay:.15s}
.loading-dots span:nth-child(3){animation-delay:.3s}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:.8}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
.inline-report{
  margin:16px 0;padding:20px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow-x:auto;
}
.inline-report table tr:nth-child(even){background:var(--bg-elevated)}
.inline-report table tbody tr:hover{background:var(--bg-hover)}
.inline-report table td,.inline-report table th{white-space:nowrap}
.inline-report strong{color:var(--text-primary)}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 16l4-6 4 4 5-8"/></svg>
    </div>
    <div>
      <h1>ASX Research Agent</h1>
      <span>Powered by Claude</span>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h2>What are you researching?</h2>
      <p>Ask about any ASX-listed stock in plain English.</p>
      <div class="suggestions" id="suggestions"></div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="input" placeholder="Ask about ASX stocks..." autocomplete="off"
             aria-label="Ask about ASX stocks">
      <button class="send-btn" id="sendBtn" type="button" aria-label="Send" onclick="send()">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted)" aria-hidden="true">
          <path d="M7 12V2M7 2L3 6M7 2L11 6"/>
        </svg>
      </button>
    </div>
    <div class="input-footer">Live mode — powered by Claude + yfinance</div>
  </div>
</div>

<script>
/* Served by the Flask app itself, so use a relative path. Falls back to
   localhost when the file is opened directly from disk (file://). */
const API_URL = location.protocol.startsWith('http')
  ? '/api/query'
  : 'http://localhost:5001/api/query';

/* Escape anything that came from the network before it goes near innerHTML */
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
));

const pct = v => v!=null ? (v*100).toFixed(1)+'%' : '—';
const fmtPrice = v => v!=null ? '$'+Number(v).toFixed(2) : '—';
const fmtRatio = v => v!=null ? Number(v).toFixed(1) : '—';
const fmtCap = v => {
  if(!v) return '—';
  if(v >= 1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if(v >= 1e6) return '$'+(v/1e6).toFixed(0)+'M';
  return '$'+v;
};
let busy = false;
let stepCounter = 0;

const suggestions = [
  "Find mining stocks with high dividends",
  "Which bank has the best ROE?",
  "Compare BHP, RIO and FMG",
  "Top growth stocks on the ASX",
  "Screen for yield above 4%",
];

const sugBox = document.getElementById('suggestions');
suggestions.forEach(s => {
  const btn = document.createElement('button');
  btn.textContent = s;
  btn.onclick = () => send(s);
  sugBox.appendChild(btn);
});

const inp = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
inp.addEventListener('input', updateBtn);
inp.addEventListener('keydown', e => { if(e.key==='Enter') send() });

function updateBtn(){
  const has = inp.value.trim().length > 0;
  sendBtn.className = 'send-btn' + (has ? ' active' : '');
  sendBtn.querySelector('svg').style.color = has ? 'var(--bg-deep)' : 'var(--text-muted)';
}

/* Build a stock data table from tool_result data */
function buildTableFromData(stocks){
  if(!stocks || !stocks.length) return '';
  // Detect if it's compare_stocks or get_stock_data format
  let h = '<div class="stock-table"><table><thead><tr>';
  const cols = ['Ticker','Name','Price','P/E','ROE','Yield','Earn Grw','Mkt Cap'];
  cols.forEach(c => h += '<th>'+c+'</th>');
  h += '</tr></thead><tbody>';
  stocks.forEach(s => {
    const ticker = (s.ticker||'').replace('.AX','');
    const price = s.price || s.current_price;
    const pe = s.pe_ratio || s.pe;
    const roe = s.roe;
    const dy = s.dividend_yield || s.divYield;
    const eg = s.earnings_growth || s.earnGrowth;
    const mc = s.market_cap_display || s.mcap || fmtCap(s.market_cap);
    const egVal = typeof eg === 'string' ? parseFloat(eg) : eg;
    const egClass = egVal != null && !Number.isNaN(egVal)
      ? (egVal >= 0 ? 'positive' : 'negative')
      : 'muted';
    const roeFmt = typeof roe === 'string' ? roe : pct(roe);
    const dyFmt = typeof dy === 'string' ? dy : pct(dy);
    const egFmt = typeof eg === 'string' ? eg : pct(eg);
    h += `<tr>
      <td>${esc(ticker)}</td>
      <td>${esc(s.name||'—')}</td>
      <td>${esc(fmtPrice(price))}</td>
      <td>${esc(fmtRatio(pe))}</td>
      <td>${esc(roeFmt)}</td>
      <td>${esc(dyFmt)}</td>
      <td class="${egClass}">${esc(egFmt)}</td>
      <td class="muted">${esc(mc)}</td>
    </tr>`;
  });
  h += '</tbody></table></div>';
  return h;
}

/* Convert markdown-ish text to HTML.
   The text is escaped first so any markup in the model's output is rendered as
   text, then the handful of markdown constructs we support are re-introduced. */
function mdToHtml(text){
  if(!text) return '';
  const body = esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^### (.+)$/gm, '<strong>$1</strong>')
    .replace(/^## (.+)$/gm, '<strong style="font-size:15px">$1</strong>')
    .replace(/^- (.+)$/gm, '<span style="padding-left:12px">• $1</span>')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>');
  return '<p>' + body + '</p>';  // wrap, so the </p><p> splits above balance
}

const chat = document.getElementById('chat');

function scrollDown(){
  chat.scrollTop = chat.scrollHeight;
}

function addUserMsg(text){
  const el = document.getElementById('welcome');
  if(el) el.remove();
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `<div class="msg-user"><div class="bubble">${esc(text)}</div></div>`;
  chat.appendChild(div);
  scrollDown();
}

function addStep(stepsDiv, name, inputStr){
  const id = 'step-' + (stepCounter++);
  const row = document.createElement('div');
  row.className = 'step running';
  row.id = id;
  row.innerHTML = `<div class="step-spinner"></div><code>${esc(name)}</code><span class="step-input">${esc(inputStr)}</span>`;
  stepsDiv.appendChild(row);
  scrollDown();
  return id;
}

function completeStep(stepId){
  const row = document.getElementById(stepId);
  if(!row) return;
  row.className = 'step done';
  const spinner = row.querySelector('.step-spinner');
  if(spinner) spinner.outerHTML = '<div class="step-check">✓</div>';
}

async function send(override){
  const query = (override || inp.value).trim();
  if(!query || busy) return;
  inp.value = '';
  updateBtn();
  busy = true;
  inp.disabled = true;

  addUserMsg(query);

  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg msg-assistant';

  const thinkingDiv = document.createElement('div');
  thinkingDiv.className = 'thinking';

  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'thinking-toggle open';
  toggleBtn.innerHTML = `<svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1.5L7 5L3 8.5" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
    <span class="thinking-label"><span class="step-spinner" style="display:inline-block;vertical-align:middle;margin-right:4px"></span> Analysing...</span>`;

  const stepsDiv = document.createElement('div');
  stepsDiv.className = 'thinking-steps';

  toggleBtn.onclick = () => {
    const isOpen = toggleBtn.classList.toggle('open');
    stepsDiv.style.display = isOpen ? 'block' : 'none';
  };

  thinkingDiv.appendChild(toggleBtn);
  thinkingDiv.appendChild(stepsDiv);
  msgDiv.appendChild(thinkingDiv);
  chat.appendChild(msgDiv);
  scrollDown();

  let toolCount = 0;
  let currentStepId = null;
  let lastTableData = null;
  let answered = false;

  const finishThinking = label => {
    toggleBtn.querySelector('.thinking-label').textContent = label;
    toggleBtn.classList.remove('open');
    stepsDiv.style.display = 'none';
  };

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query}),
    });

    if(!res.ok || !res.body){
      let detail = `Server responded ${res.status}`;
      try { const j = await res.json(); if(j && j.error) detail = j.error; } catch(e){}
      throw new Error(detail);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    const handleLine = line => {
      if(!line.startsWith('data: ')) return;
      const raw = line.slice(6).trim();
      if(!raw) return;

      let evt;
      try { evt = JSON.parse(raw); } catch(e){ return; }

      if(evt.type === 'tool_call'){
        // Complete previous step if any
        if(currentStepId) completeStep(currentStepId);
        toolCount++;
        const inputSummary = JSON.stringify(evt.input).slice(0,80);
        currentStepId = addStep(stepsDiv, evt.name, inputSummary);
      }
      else if(evt.type === 'tool_result'){
        if(currentStepId) completeStep(currentStepId);
        currentStepId = null;
        // Store data for table rendering
        if(Array.isArray(evt.data) && evt.data.length > 0 && evt.data[0].ticker){
          lastTableData = evt.data;
        }
      }
      else if(evt.type === 'text'){
        // Interim commentary between tool calls
        if(evt.content && evt.content.trim()){
          const interim = document.createElement('div');
          interim.className = 'analysis';
          interim.innerHTML = mdToHtml(evt.content);
          msgDiv.appendChild(interim);
          scrollDown();
        }
      }
      else if(evt.type === 'html_report'){
        const reportDiv = document.createElement('div');
        reportDiv.className = 'inline-report';
        // Trusted: generated server-side by tools._build_html_report,
        // which escapes every value it interpolates.
        reportDiv.innerHTML = evt.content;
        msgDiv.appendChild(reportDiv);
        scrollDown();
      }
      else if(evt.type === 'answer'){
        answered = true;
        if(currentStepId){ completeStep(currentStepId); currentStepId = null; }
        finishThinking(`Used ${toolCount} tool${toolCount!==1?'s':''}`);

        // Render Claude's answer
        const analysisDiv = document.createElement('div');
        analysisDiv.className = 'analysis';
        analysisDiv.innerHTML = mdToHtml(evt.content);
        msgDiv.appendChild(analysisDiv);

        // Render table from last tool result with stock data
        if(lastTableData){
          const tableWrap = document.createElement('div');
          tableWrap.innerHTML = buildTableFromData(lastTableData);
          if(tableWrap.firstChild) msgDiv.appendChild(tableWrap.firstChild);
        }
        scrollDown();
      }
      else if(evt.type === 'error'){
        answered = true;
        if(currentStepId){ completeStep(currentStepId); currentStepId = null; }
        finishThinking('Error');
        const errDiv = document.createElement('div');
        errDiv.className = 'analysis';
        errDiv.innerHTML = `<p style="color:var(--red)">${esc(evt.content)}</p>`;
        msgDiv.appendChild(errDiv);
        scrollDown();
      }
      else if(evt.type === 'done'){
        // stream finished
      }
    };

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream: true});

      const lines = buffer.split('\n');
      buffer = lines.pop(); // keep incomplete line
      lines.forEach(handleLine);
    }
    // Flush anything left in the buffer when the stream closed
    buffer.split('\n').forEach(handleLine);

    if(!answered){
      finishThinking('Incomplete');
      const errDiv = document.createElement('div');
      errDiv.className = 'analysis';
      errDiv.innerHTML = `<p style="color:var(--red)">The stream ended before an answer arrived. Check the server logs.</p>`;
      msgDiv.appendChild(errDiv);
      scrollDown();
    }
  } catch(err){
    finishThinking('Connection error');
    const errDiv = document.createElement('div');
    errDiv.className = 'analysis';
    errDiv.innerHTML = `<p style="color:var(--red)">Could not reach the agent server (${esc(err.message)}). Make sure <code>python server.py</code> is running on port 5001.</p>`;
    msgDiv.appendChild(errDiv);
    scrollDown();
  } finally {
    busy = false;
    inp.disabled = false;
    updateBtn();
    inp.focus();
  }
}
</script>
</body>
</html>
